[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pca-sam"
version = "0.1.0"
description = "Photonic-contrast-aware SAM for cell instance analysis in HHG biopsy images"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
dependencies = ["mmdet==3.2.0", "mmengine>=0.10.0,<1.0.0", "numpy<2", "pycocotools>=2.0.6"]

[tool.setuptools.packages.find]
include = ["pca_sam*"]

[tool.setuptools.package-data]
pca_sam = ["py.typed"]
